      .preloader-wordmark { position: relative; display: grid; color: #fff; font: 700 clamp(1.8rem, 7.8vw, 4.5rem)/1.2 ui-monospace, monospace; letter-spacing: .06em; }

      .preloader-letters { display: flex; justify-content: center; }
      .preloader-letter { position: relative; display: grid; width: 1ch; text-align: center; }
      .preloader-letter > span { grid-area: 1 / 1; }
      .preloader-original { color: #fff; animation: preloader-letter-out 320ms var(--shift) both; }
      .preloader-scan { color: transparent; -webkit-text-stroke: 1px #e9cd87; animation: preloader-letter-scan 320ms var(--shift) both; }
      .preloader-final { color: #e9cd87; animation: preloader-letter-in 320ms var(--shift) both; }
      .preloader-static { display: none; color: #e9cd87; }
      .preloader-progress { width: 5rem; height: 2px; background: #e9cd87; transform-origin: left; animation: preloader-progress 3.5s linear both; }
      @keyframes preloader-letter-out { 0% { opacity: 1; } 30%, 100% { opacity: 0; } }
      @keyframes preloader-letter-scan {
        0%, 100% { opacity: 0; }
        30% { opacity: .75; transform: scaleY(.8) translateY(-.12em); }
        58% { opacity: 1; transform: scaleY(1.07) translateY(.04em); }
      }
      @keyframes preloader-letter-in {
        0%, 55% { opacity: 0; transform: translateY(.12em); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes preloader-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes preloader-exit { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
