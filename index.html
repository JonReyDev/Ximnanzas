    <style>
      #ximnanzas-preloader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.8rem; background: #102238; color: #edcf86; pointer-events: none; animation: preloader-exit 250ms 4s both; }
      #ximnanzas-preloader[data-ready] { animation: preloader-exit 250ms both; }
      .preloader-monogram { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border: 1px solid #edcf8680; border-radius: 50%; font: 2rem Georgia, serif; }
      .preloader-brand { font: 600 0.75rem system-ui, sans-serif; letter-spacing: 0.28em; }
      .preloader-progress { width: 4rem; height: 2px; background: #edcf8640; overflow: hidden; }
      .preloader-progress::after { content: ""; display: block; width: 50%; height: 100%; background: #edcf86; animation: preloader-progress 780ms ease-in-out infinite alternate; }
      @keyframes preloader-progress { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
      @keyframes preloader-exit { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .preloader-progress::after { animation: none; } #ximnanzas-preloader[data-ready] { animation-duration: 0s; } }
